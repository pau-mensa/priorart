[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "priorart"
version = "0.1.0"
description = "Self-hostable text store for shared coding-agent experiences: put, search, report."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
authors = [{ name = "Pau Montserrat" }]
keywords = ["retrieval", "agents", "late-interaction", "knowledge-base"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "lateweave>=0.1.0",
  "numpy>=1.26,<3",
  "bm25s>=0.3,<0.4",
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
encoder = ["onnxruntime>=1.20,<2", "tokenizers>=0.21,<1", "huggingface-hub>=0.34,<2"]
mcp = [
    "mcp>=2.2,<3",
]

[project.urls]
Repository = "https://github.com/pau-mensa/priorart"

[project.scripts]
priorart = "priorart.__main__:main"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8,<9",
    "ruff>=0.6",
]

[tool.uv.sources]
# lateweave is not on PyPI yet; built from the sibling checkout by maturin.
# Delete this entry once a release is published.
lateweave = { path = "../lateweave" }

[tool.hatch.build.targets.wheel]
packages = ["src/priorart"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

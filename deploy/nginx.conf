# Compose publishes nginx on loopback only, so every request arrives from the
# Docker gateway. Take the client address from a tunnel's header on the host
# (CF-Connecting-IP for cloudflared) so the limit below applies per client; use
# your proxy's header instead, or each client shares one limit.
set_real_ip_from 172.30.0.1;
real_ip_header CF-Connecting-IP;
limit_req_zone $binary_remote_addr zone=priorart:10m rate=10r/s;

server {
    listen 80;

    # Resolved per request, so nginx starts while priorart is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $priorart http://priorart:8000;

    limit_req zone=priorart burst=40 nodelay;
    client_max_body_size 2200k;   # 256 * PRIORART_MAX_TOKENS + 65536
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Set to https when TLS terminates in front of nginx (a tunnel or load balancer).
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;          # export and search-log streams

    location ~ ^/v1/collections/[^/]+/import$ {
        client_max_body_size 130m;
        proxy_read_timeout 600s;
        proxy_pass $priorart;
    }

    location / {
        proxy_pass $priorart;
    }
}

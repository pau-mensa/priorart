# priorart behind nginx, which terminates TLS or sits behind a tunnel that does.
#   PRIORART_ADMIN_TOKEN=$(openssl rand -hex 32) docker compose -f deploy/compose.yaml up -d
services:
  priorart:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    environment:
      PRIORART_MODE: authenticated
      PRIORART_TRUSTED_PROXIES: 172.30.0.10
      PRIORART_ADMIN_TOKEN: ${PRIORART_ADMIN_TOKEN:?set PRIORART_ADMIN_TOKEN}
      PRIORART_KEY_REQUESTS_PER_MINUTE: "600"
    volumes:
      - data:/data
    networks: [edge]
    healthcheck:
      # Loopback is not a trusted proxy, so this must not send X-Forwarded-Proto.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s

  nginx:
    image: nginx:1.28
    restart: unless-stopped
    ports: ["${NGINX_PORT:-8080}:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      edge:
        ipv4_address: 172.30.0.10

volumes:
  data:

networks:
  edge:
    ipam:
      config: [{subnet: 172.30.0.0/24}]

[package]
name = "priorart"
version = "0.8.0"
edition = "2021"
rust-version = "1.88"
description = "Self-hostable text store for shared coding-agent experiences: put, search, get."
license = "MIT"
authors = ["Pau Montserrat"]
repository = "https://github.com/pau-mensa/priorart"
keywords = ["retrieval", "agents", "bm25", "knowledge-base"]

[dependencies]
axum = "0.8.9"
caseless = "0.2.2"
clap = { version = "4.6.7", features = ["derive", "env"] }
fs2 = "0.4.3"
futures-util = "0.3.34"
getrandom = "0.4.3"
ipnet = "2.12.2"
lateweave = { git = "https://github.com/pau-mensa/lateweave", rev = "8e7df67725515cebf1dc3b64580ccb4768e4436b", version = "0.1.0" }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
rmcp = { version = "2.2.0", features = ["server", "transport-io"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.21"
time = { version = "0.3.45", features = ["formatting", "macros"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
rmcp = { version = "2.2.0", features = ["client"] }
tempfile = "3.27.0"
